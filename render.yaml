services:
  - type: web
    name: impactify-backend
    runtime: node
    rootDir: server
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
